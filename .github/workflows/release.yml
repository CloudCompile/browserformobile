name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run lint
                  npm test
                  npm run build

            - name: Extract release notes from CHANGELOG
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  node -e '
                    const fs = require("fs");
                    const tag = process.argv[1];
                    const text = fs.readFileSync("CHANGELOG.md", "utf8");
                    const start = text.indexOf("## " + tag + " ");
                    if (start === -1) process.exit(0);
                    const rest = text.slice(start + 3 + tag.length);
                    const end = rest.indexOf("\n## ");
                    const notes = (end === -1 ? rest : rest.slice(0, end)).trim();
                    fs.writeFileSync("RELEASE_NOTES.md", notes + "\n\n---\n\nFull changelog: CHANGELOG.md in the repository.");
                  ' "$tag"
                  [ -f RELEASE_NOTES.md ] && echo "notes=true" >> "$GITHUB_OUTPUT" || echo "notes=false" >> "$GITHUB_OUTPUT"
              id: notes

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  assets=(main.js manifest.json)
                  if [ "${{ steps.styles.outputs.exists }}" = "true" ]; then assets+=("styles.css"); fi
                  # A tag can be re-pushed (a failed publish, a rebuilt asset). A
                  # second `gh release create` for the same tag would draft a
                  # duplicate — how eighteen stale drafts piled up — so an
                  # existing release is updated in place instead: assets are
                  # re-uploaded over the old ones and the notes are refreshed.
                  if gh release view "$tag" > /dev/null 2>&1; then
                      gh release upload "$tag" "${assets[@]}" --clobber
                      edit_args=("$tag" --title="$tag")
                      if [ "${{ steps.notes.outputs.notes }}" = "true" ]; then edit_args+=(--notes-file=RELEASE_NOTES.md); fi
                      gh release edit "${edit_args[@]}"
                  else
                      args=("$tag" --title="$tag" --draft "${assets[@]}")
                      if [ "${{ steps.notes.outputs.notes }}" = "true" ]; then args+=(--notes-file=RELEASE_NOTES.md); fi
                      gh release create "${args[@]}"
                  fi
